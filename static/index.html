<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crouch Job Searcher</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Crouch Job Searcher 💼</h1>
        </header>

        <!-- Home / Filters Screen -->
        <div id="upload-screen" class="screen active" style="overflow-y: auto;">
            <h2>Welcome to Crouch</h2>
            <p>Configure your search and upload your CV. Our AI will evade ATS detectors 100% guaranteed.</p>
            
            <div class="filters">
                <input type="text" id="query-input" placeholder="Role (e.g. Software Engineer)" value="Developer" />
                
                <select id="location-input">
                    <option value="Remote">Remote (Global)</option>
                    <option value="LATAM">Latin America</option>
                    <option value="USA">United States</option>
                    <option value="Europe">Europe</option>
                </select>

                <select id="language-input">
                    <option value="es">Spanish</option>
                    <option value="en">English</option>
                </select>
            </div>

            <div class="accounts">
                <h3>Link Accounts (Trust Boost)</h3>
                <button id="btn-linkedin" class="acc-btn linkedin">Connect LinkedIn</button>
                <button id="btn-github" class="acc-btn github">Connect GitHub</button>
            </div>

            <div class="upload-box" style="margin-top:20px;">
                <input type="file" id="cv-upload" accept="application/pdf" />
                <label for="cv-upload" class="upload-btn">Upload Original CV</label>
            </div>
            <p id="file-name" style="margin-top: 10px; font-weight: 600;"></p>
            
            <button id="start-btn" disabled>Search Jobs</button>
        </div>

        <!-- Swipe Screen -->
        <div id="swipe-screen" class="screen">
            <div id="card-container"></div>
            <div class="controls">
                <button id="btn-pass" class="control-btn no" title="Discard">❌</button>
                <button id="btn-apply" class="control-btn yes" title="Apply (Anti-AI)">🚀</button>
            </div>
        </div>

        <!-- Result Screen (Optimizer) -->
        <div id="result-screen" class="screen">
            <h2>🎉 Applied!</h2>
            <p>Crouch AI is injecting keywords evading ATS detectors for:<br><strong id="applied-job-title" style="color:#00ff88"></strong></p>
            <div id="loader" class="loader"></div>
            <div id="optimized-cv-container" style="display: none; width: 100%; height: 100%;">
                <h3 style="margin-bottom: 5px; font-size:1rem;">Adapted CV (Undetectable):</h3>
                <textarea id="optimized-cv-text" readonly></textarea>
                <button id="back-to-swipe-btn">Next Job</button>
            </div>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
